# YOLOv11 instance segmentation. Folds come from data/processed/splits.json (never
# Ultralytics' own split). Hue jitter is kept tiny because hue carries the polymer
# (Nile Red emission colour) signal.
seed: 42
model: yolo11s-seg.pt
imgsz: 640
epochs: 150
patience: 30
optimizer: AdamW
lr0: 0.001
deterministic: true
batch: 6                 # 4 GB GPU: batch 16 spills to shared memory (6x slower), batch 8 runs out of memory in validation
workers: 2                # this machine: 16 GB RAM shared with other programs; 4 workers hit MemoryError

augment:
  hsv_h: 0.01
  hsv_s: 0.3
  hsv_v: 0.3
  degrees: 180
  scale: 0.2          # 0.8-1.2
  fliplr: 0.5
  flipud: 0.5
  mosaic: 1.0
  close_mosaic: 10    # mosaic off for the last 10 epochs

classes: [pvc, nylon]

smoke:
  model: yolo11s-seg.yaml   # architecture only: no weights download for the smoke test
  epochs: 2
  imgsz: 320
  n_images: 20
  batch: 4

# Shorter budget for a single 4 GB laptop GPU (about 1.5 min per epoch at batch 8, 640 px).
# The full 150-epoch schedule needs roughly 3.5 hours per fold on that GPU.
schedule:
  short: {epochs: 30, patience: 10}
