[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mp"
version = "0.2.0"
description = "Microplastic detection: data pipeline, models and evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "opencv-python-headless>=4.9,<5.1",
    "pillow>=10.2,<13",
    "imagehash>=4.3.1,<5",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "pyyaml>=6.0,<7",
    "tqdm>=4.66,<5",
    "requests>=2.31,<3",
    "scipy>=1.11,<2",
    "scikit-image>=0.22,<1",
    "joblib>=1.3,<2",
    "shap>=0.45,<1",
    "ultralytics>=8.3,<9",
    "torch>=2.2,<3",   # CPU wheel is enough for the smoke test
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
mp = "mp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
